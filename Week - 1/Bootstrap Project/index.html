<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="C:\Users\Ayush dalwala\Pictures\ic_3.png" style="width: 35px; height: 35px; margin-right: 8px;" alt="logo">
                <span class="fw-bold">Dashboard</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navmenu">
                <div class="d-flex gap-2">
                    <a href="project_details.html" class="btn btn-outline-light">Project Details</a>
                    <a href="contact.html" class="btn btn-primary">Contact Me</a>
                </div>
            </div>

        </div>
    </nav>

    <div class="container py-5">
        <h1 class="text-center">Welcome to Dashboard</h1>
        <p class="text-center text-muted">
            Bootstrap Project
        </p>
    </div>

    <div class="container mt-3">
        <h3 class="mb-3 text-center">Contact Details</h3>

        <table class="table table-bordered table-striped">
            
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Remarks</th>
                    <th>Time</th>
                </tr>
            </thead>

            <tbody id="contactTableBody">

            </tbody>
        </table>
    </div>

    <script>
        function loadContacts(){
            
            let data = localStorage.getItem("contacts");

            if (!data) {
                document.getElementById("contactTableBody").innerHTML = 
                `<tr>
                    <td colspan="5" class="text-center text-muted">No contact records found</td>
                </tr>`;
                return;
            }

            let contacts = JSON.parse(data);

            let tbody = document.getElementById("contactTableBody");
            tbody.innerHTML = "";

            contacts.forEach((c, index) => {
                let row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${c.name}</td>
                        <td>${c.email}</td>
                        <td>${c.remarks}</td>
                        <td>${c.time}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        loadContacts();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
