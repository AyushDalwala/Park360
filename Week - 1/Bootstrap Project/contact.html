<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    

   <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="C:\Users\Ayush dalwala\Pictures\ic_3.png" style="width: 35px; height: 35px; margin-right: 8px;">
                <span class="fw-bold">Dashboard</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navmenu">
                <div class="d-flex gap-2">
                    <a href="project_details.html" class="btn btn-outline-light">Project Details</a>
                    <a href="contact.html" class="btn btn-primary">Contact Me</a>
                </div>
            </div>

        </div>
    </nav>

    <div class="container py-5" style="max-width: 600px;">

        <h2 class="text-center mb-4 fw-bold">Contact Me</h2>

        <div id="msg" class="alert alert-success d-none">
            Your details saved successfully
        </div>

        <form id="contactForm" class="card p-4 shadow">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Remarks</label>
                <textarea id="remarks" class="form-control" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit</button>

        </form>

    </div>

    <script>
        
        document.getElementById("contactForm").addEventListener("submit", function(e){
            e.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let remarks = document.getElementById("remarks").value;

            let contactData = {
                name: name,
                email: email,
                remarks: remarks,
                time: new Date().toLocaleString().toUpperCase()
            };

            let stored = JSON.parse(localStorage.getItem("contacts")) || [];    
            stored.push(contactData);                                           
            localStorage.setItem("contacts",JSON.stringify(stored));            
            document.getElementById("msg").classList.remove("d-none");         
            document.getElementById("contact-form").reset();                   
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
