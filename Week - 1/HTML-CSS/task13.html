<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid and Model</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    
    <div class="container mt-3">
        
        <div class="row">
            <div class="col-4 bg-primary text-white">Column 1</div>
            <div class="col-8 bg-warning">Column 2</div>
        </div>
        
        <br>

        <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#m1">Open Modal</button>

        <div class="modal fade" id="m1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"><h5>My Modal</h5></div>
                    <div class="modal-body">Hello World!!</div>
                    <div class="modal-footer">
                        <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

      <div class="container mt-5">
        <h2 class="text-center text-primary mb-4">
            Bootstrap Card Example
        </h2>

        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    
                    <img src="C:\Users\Ayush dalwala\Pictures\profile.png" class="card-img-top" alt="Card Image">
                    
                    <div class="card-body text-center">
                        <h5 class="card-title">Bootstrap Card</h5>
                        <p class="card-text">
                            Simple Bootstrap Card
                        </p>
                        <a href="#" class="btn btn-primary">
                            Read More
                        </a>
                    </div>

                    <div class="card-footer text-muted text-center">
                        Updated 2 days ago
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
