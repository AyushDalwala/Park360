<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display and Z-Index</title>

    <style>
        .box1{
            position: absolute;
            top: 50px;
            left: 50px;
            width: 150px;
            height: 150px;
            background: red;
            z-index: 2;
        }

        .box2{
            position: absolute;
            top: 80px;
            left: 80px;
            width: 150px;
            height: 150px;
            background: yellow;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
</body>
</html>
