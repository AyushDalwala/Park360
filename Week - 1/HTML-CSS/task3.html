<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
  <h2 id="title">Hello World</h2>

  <button onclick="changeText()">Click Me</button>

  <script>
    function changeText() {
        let h = document.getElementById("title");
        h.innerText = "DOM updated successfully";
        h.style.color = "blue";
    }
  </script>
</body>
</html>
