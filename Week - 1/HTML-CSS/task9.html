<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class and element</title>

    <style>
        body{
            font-family: Arial;
            padding: 30px;
        }

        .btn:hover{
            background-color: green;
            color: white;
        }

        input:focus{
            border: 2px solid blue;
            outline: none;
        }

        a:active{
            color: red;
        }

        ul li:first-child{
            color: orange;
            font-weight: bold;
        }

        h2::before{
            content: "--- ";
            color: red;
        }

        h2::after{
            content: " ---";
            color: green;
        }

        p::first-letter{
            font-size: 30px;
            color: blue;
        }

        p::first-line{
            font-weight: bold;
        }

        ::selection{
            background-color: yellow;
            color: black;
        }
    </style>

</head>
<body>
    
    <h2>Pseudo Class and Element</h2>

    <button class="btn">Hover Here....</button>
    <br><br>

    <input type="text" placeholder="Click Here">
    <br><br>

    <a href="#">Click Link</a>

    <ul>
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
    </ul>

    <p>
        select this text to see selection effect
    </p>

</body>
</html>
