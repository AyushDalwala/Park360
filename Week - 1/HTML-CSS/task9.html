<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class and element</title>

    <style>
        a:hover{
            color: red;
        }

        p::first-letter{
            font-size: 30px;
            color: blue;
        }
    </style>

</head>
<body>
    
    <a href="#">Hover Here</a>

    <p>Paragraph 1</p>

</body>
</html>
