<input type="number" id="num" placeholder="Enter number">
<button onclick="calculate()">Calculate</button>

<h3 id="result"></h3>

<script>
    function calculate() {
        let n = Number(document.getElementById("num").value);

        let output = `
            Square: ${n ** 2} <br>
            Cube: ${n ** 3} <br>
            Square Root: ${Math.sqrt(n)} <br>
            Absolute: ${Math.abs(n)} <br>
            Rounded: ${Math.round(n)} <br>
            Floor: ${Math.floor(n)} <br>
            Ceil: ${Math.ceil(n)}
        `;

        document.getElementById("result").innerHTML = output;
    }
    
</script>
