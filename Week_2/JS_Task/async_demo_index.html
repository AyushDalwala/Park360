<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Await</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        button {
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0px 0px 5px gray;
        }

        .users {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Async / Await Mini Project</h2>
        <h3>Fetch Users from API</h3>

        <button onclick="loadUsers()">Get Users</button>

        <div class="users" id="userBox"></div>
    </div>

    <script>
        async function loadUsers() {
            const displayArea = document.getElementById("userBox");
            displayArea.innerHTML = "<h3>Loading...</h3>";

            try {
                const serverResponse = await fetch("https://jsonplaceholder.typicode.com/users");
                const userList = await serverResponse.json();

                displayArea.innerHTML = "";


                userList.forEach(singleUser => {
                    const userCard = document.createElement("div");
                    userCard.className = "card";

                    userCard.innerHTML = `
                        <h4>${singleUser.name}</h4>
                        <p>Email: ${singleUser.email}</p>
                        <p>City: ${singleUser.address.city}</p>
                        <p>Company: ${singleUser.company.name}</p>
                    `;

                    displayArea.appendChild(userCard);
                });
            } catch (networkError) {
                displayArea.innerHTML = "<h3 style='color:red'>Failed to load data</h3>";
                console.log(networkError);
            }
        }
    </script>

</body>
</html>
