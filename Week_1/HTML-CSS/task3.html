<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
      .box{
        padding: 10px;
        background: lightblue;
        margin: 5px;
      }
    </style>
</head>
<body>
  
  <h2 id="title">DOM Methods</h2>

  <p class="box">Paragraph 1</p>
  <p class="box">Paragraph 2</p>

  <button onclick="changeText()">Change Text</button>
  <button onclick="changeColor()">Change Color</button>

  <script>

    function changeText() {
      document.getElementById("title").innerHTML = "text changed";
    }

    function changeColor() {
      let elements = document.getElementsByClassName("box");
      elements[0].style.backgroundColor = "orange";
      elements[1].style.backgroundColor = "lightgreen";
    }

    let allParagraph = document.getElementsByTagName("p");
    console.log(allParagraph.length);

    let heading = document.querySelector("#title");
    heading.style.color = "blue";

    let boxes = document.querySelectorAll(".box");
    boxes.forEach(box => {
      box.style.border = "2px solid black";
    });

    document.getElementById("title").addEventListener("click", function() {
      alert("Heading clicked");
    });
    
  </script>

</body>
</html>
