<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basics</title>

    <style>
        p{
            color: green;
            font-size: 20px;
        }

        body{
            font-family: Arial;
            padding: 20px;
        }

        h2{
            margin-top: 40px;
            color: #333;
        }

        .block-box{
            display: block;
            background: lightblue;
            margin: 5px 0;
            padding: 10px;
        }

        .inline-box{
            display: inline;
            background: lightgreen;
            padding: 10px;
        }

        .inline-block-box{
            display: inline-block;
            width: 120px;
            height: 50px;
            background: orange;
            margin: 5px;
            text-align: center;
            line-height: 50px;
        }

        .hidden-box{
            display: none;
        }

        .flex-container{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #eee;
            padding: 15px;
        }

        .flex-item{
            background: tomato;
            color: white;
            padding: 20px;
            width: 100px;
            text-align: center;
        }
    </style>
</head>
<body>
    <p>This text is styled using Internal CSS</p>

    <p style="color: red;">This text use Inline CSS</p>

    <br/>
    <h1>CSS Display Properties</h1>
    
    <h2>Display : Block</h2>
    <div class="block-box">Block 1</div>
    <div class="block-box">Block 2</div>

    <h2>Display : Inline</h2>
    <div class="inline-box">Inline 1</div>
    <div class="inline-box">Inline 2</div>

    <h2>Display : Inline-Block</h2>
    <div class="inline-block-box">Box 1</div>
    <div class="inline-block-box">Box 2</div>

    <h2>Display : None</h2>
    <p>This text is visible</p>
    <div class="hidden-box">Invisible</div>

    <h2>Display : Flex</h2>
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
        <div class="flex-item">Item 4</div>
    </div>

</body>
</html>
