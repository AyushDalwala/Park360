<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Grid</title>

    <style>
      body{
        font-family: Arial;
        padding: 20px;
      }

      h2{
        margin-top: 40px;
      }

      .float-container{
        border: 2px solid black;
        overflow: hidden;
      }

      .float-box{
        width: 30%;
        height: 100px;
        float: left;
        background: lightcoral;
        margin: 1%;
        text-align: center;
        line-height: 100px;
      }

      .flex-container{
        display: flex;
        justify-content: space-between;
        border: 2px solid black;
        padding: 10px;
      }

      .flex-box{
        width: 30%;
        height: 100px;
        background: lightgreen;
        text-align: center;
        line-height: 100px;
      }

      .grid-container{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        border: 2px solid black;
        padding: 10px;
      }

      .grid-box{
        height: 100px;
        background: lightblue;
        text-align: center;
        line-height: 100px;
      }

    </style>
</head>
<body>
    
    <h1>Float, Flex and Grid</h1>

    <h2>Float</h2>
    <div class="float-container">
        <div class="float-box">Float 1</div>
        <div class="float-box">Float 2</div>
        <div class="float-box">Float 3</div>
    </div>

    <h2>Flex</h2>
    <div class="flex-container">
        <div class="flex-box">Flex 1</div>
        <div class="flex-box">Flex 2</div>
        <div class="flex-box">Flex 3</div>
    </div>

    <h2>Grid</h2>
    <div class="grid-container">
        <div class="grid-box">Grid 1</div>
        <div class="grid-box">Grid 2</div>
        <div class="grid-box">Grid 3</div>
    </div>

</body>
</html>
